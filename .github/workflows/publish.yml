name: publish-app-cluster

# Publishes @privos_ai/app-cluster to npm WITH sigstore provenance.
#
# Provenance is mandatory here, not optional: the privos-app-cluster installer
# refuses to install any version that has no registry attestation
# (verifyProvenanceOrThrow in src/cli/service-install.ts), because the service
# runs with docker.sock access and is root-equivalent on every customer machine.
# `npm publish --provenance` on a laptop fails with "provider: null" — provenance
# can only be generated from an OIDC-enabled CI run, so this workflow is the only
# supported publish path for this package.
#
# Uses npm Trusted Publishing (OIDC) — no token anywhere. One-time setup on
# npmjs.com (@privos_ai/app-cluster -> Settings -> Trusted Publisher):
#   Publisher: GitHub Actions | Organization: PrivOS-AI | Repository: privos-cluster
#   Workflow filename: publish.yml | Environment: (blank)
# After that, the repo secret NPM_TOKEN can be deleted.
#
# Trigger: push a tag `v<version>` that matches package.json's version, or run
# the workflow manually. GitHub evaluates this file at the pushed ref, so cut the
# tag from a branch that contains it (privos-mt).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required for npm provenance (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; ensure it regardless of the bundled version.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prepublishOnly runs the build; trusted publishing mints a short-lived
      # OIDC credential and generates provenance automatically — no token.
      - run: npm publish --access public

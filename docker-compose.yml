services:
  cluster:
    build: .
    container_name: privos-cluster
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    env_file: .env
    # Stateless agent — no local database, so no data volume. The only mount is
    # the Docker socket it manages containers through. All state lives in Docker
    # (container labels) and in privos-hub.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - mcp-apps-network
    restart: unless-stopped

networks:
  default:
    name: privos-network
    external: true
  mcp-apps-network:
    name: mcp-apps-network
    driver: bridge

services:
  cluster:
    build: .
    container_name: privos-cluster
    ports:
      - "4000:4000"
      # Native reverse proxy port (REVERSE_PROXY_MODE=native). v1 deploy shape is
      # cluster-on-host with the proxy on 127.0.0.1 for the local cloudflared
      # tunnel — this compose (containerized) variant is documented but out of
      # scope for v1 (native in-container needs a non-loopback bind).
      # - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    env_file: .env
    # The fleet agent keeps only its node signing identity on durable host
    # storage. Per-replica Unix sockets are runtime-only and live below /run.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/privos:/var/lib/privos
      - /run/privos/mcp-broker:/run/privos/mcp-broker
    networks:
      - default
      - mcp-apps-network
    restart: unless-stopped

networks:
  default:
    name: privos-network
    external: true
  mcp-apps-network:
    name: mcp-apps-network
    driver: bridge
